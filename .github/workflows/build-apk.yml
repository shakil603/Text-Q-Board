name: Build Text Q Board Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Initialize Capacitor Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Text-Q-Board.apk
          ls -lh build-output/Text-Q-Board.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Text-Q-Board-Android-APK
          path: build-output/Text-Q-Board.apk
          retention-days: 30

      - name: Create Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Text Q Board Android APK v1.0.${{ github.run_number }}
          body: |
            ### Text Q Board Android APK Release
            - **App Name**: Text Q Board
            - **Package**: `com.textqboard.app`
            - **Build Number**: #${{ github.run_number }}
            - **Features**: Complete Gboard replica with Bangla Phonetic (Avro), Jatiya & Probhat layouts, Cyber Cyan Theme, Glide Typing, Voice Typing, Clipboard Manager, Text Editing D-Pad, and Emoji Kitchen.
          files: build-output/Text-Q-Board.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
