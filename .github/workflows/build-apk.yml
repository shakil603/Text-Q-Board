name: Build Text Q Board Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK & Accept Licenses
        run: |
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> $GITHUB_ENV
          SDKMANAGER=$(find "$ANDROID_SDK" -name "sdkmanager" -type f | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses || true
          fi

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Initialize Capacitor Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          echo "sdk.dir=${ANDROID_HOME:-/usr/local/lib/android/sdk}" > android/local.properties

      - name: Grant Execute Permission for Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Find and Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/Text-Q-Board.apk
          ls -lh build-output/Text-Q-Board.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Text-Q-Board-Android-APK
          path: build-output/Text-Q-Board.apk
          retention-days: 30

      - name: Create Release with APK
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" build-output/Text-Q-Board.apk \
            --title "Text Q Board Android APK $TAG" \
            --notes "### Text Q Board Android APK Release
          - **App Name**: Text Q Board
          - **Package**: com.textqboard.app
          - **Build Number**: #${{ github.run_number }}
          - **Features**: Complete Gboard replica with Bangla Phonetic (Avro), Jatiya & Probhat layouts, Cyber Cyan Theme, Glide Typing, Voice Typing, Clipboard Manager, Text Editing D-Pad, and Emoji Kitchen." || true
